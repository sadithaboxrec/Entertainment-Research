<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f4">
  <meta name="description" content="A new website is on its way.">
  <title>Coming soon</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #20231f;
      background: #f7f7f4;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 24px;
    }

    main {
      width: min(100%, 680px);
      padding: clamp(36px, 8vw, 72px);
      border: 1px solid #e7e8e1;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 24px 80px rgb(32 35 31 / 5%);
    }

    .mark {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border-radius: 14px;
      background: #e8f1e8;
      color: #356143;
    }

    .mark svg { width: 22px; height: 22px; }

    .eyebrow {
      margin: 48px 0 14px;
      color: #52745b;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 520px;
      margin: 0;
      font-size: clamp(40px, 8vw, 64px);
      font-weight: 600;
      letter-spacing: -.055em;
      line-height: 1.04;
    }

    .message {
      max-width: 430px;
      margin: 22px 0 0;
      color: #686d66;
      font-size: 17px;
      line-height: 1.7;
    }

    .rule {
      height: 1px;
      margin: 48px 0 18px;
      border: 0;
      background: #ecece7;
    }

    footer {
      color: #92968f;
      font-size: 13px;
    }

    @media (max-width: 480px) {
      main { border-radius: 20px; }
      .eyebrow { margin-top: 40px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 3.5 19 6v5.4c0 4.3-2.9 7.8-7 9.1-4.1-1.3-7-4.8-7-9.1V6l7-2.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        <path d="m9 12 2 2 4-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <p class="eyebrow">A little patience</p>
    <h1>Something good is on its way.</h1>
    <p class="message">We’re getting things ready. Please check back soon.</p>
    <hr class="rule">
    <footer>Thanks for stopping by.</footer>
  </main>
</body>
</html>
